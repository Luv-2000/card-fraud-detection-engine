spring.application.name=fraud-service
spring.datasource.url=jdbc:postgresql://localhost:5432/frauddb
spring.datasource.username=fraud
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fraud-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.luv.fraud_service.entity.Transaction
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.luv.fraud_service.entity
spring.data.redis.host=localhost
spring.data.redis.port=6379
fraud.rules.high-amount.threshold=50000
fraud.rules.high-risk-merchant.categories=GAMBLING,CRYPTO_EXCHANGE
fraud.rules.velocity.max-transactions=10
fraud.rules.velocity.window-seconds=60
fraud.rules.country-change.window-minutes=30
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60
app.auth.username=${APP_USERNAME}
app.auth.password-hash=${APP_PASSWORD_HASH}
